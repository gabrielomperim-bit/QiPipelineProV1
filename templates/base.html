<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QITech Pipeline{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/qi-favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'styles/app.css' %}">
</head>
<body>
    <div class="page-shell">
        <header class="top-navigation">
            <a class="top-brand" href="{% url 'home' %}" aria-label="Ir para o início">
                <span class="brand-mark">QI</span>
                <span class="top-brand-copy">
                    <strong>Workspace</strong>
                    <small>QITech Pipeline Pro</small>
                </span>
            </a>
            <nav class="top-links" aria-label="Navegação principal">
                <a{% if request.resolver_match.url_name == "catalogo_fundos" or request.resolver_match.url_name == "home" %} class="active"{% endif %} href="{% url 'catalogo_fundos' %}">Fundos</a>
                <a{% if request.resolver_match.url_name == "minha_carteira" %} class="active"{% endif %} href="{% url 'minha_carteira' %}">Minha carteira</a>
                {% if is_workspace_admin %}<a{% if request.resolver_match.url_name == "gerenciar_usuarios" %} class="active"{% endif %} href="{% url 'gerenciar_usuarios' %}">Usuários</a>{% endif %}
            </nav>
            <div class="top-user">
                <span>{{ request.user.first_name|default:request.user.username }}</span>
                <a class="top-password" href="{% url 'password_change' %}">Senha</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="top-logout">Sair</button>
                </form>
            </div>
        </header>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
