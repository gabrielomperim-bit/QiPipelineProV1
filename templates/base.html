<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QITech Pipeline{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/qi-favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'styles/app.css' %}">
</head>
<body>
    <div class="page-shell">
        <header class="top-navigation">
            <a class="top-brand" href="{% url 'home' %}" aria-label="Ir para o início">
                <span class="brand-mark">QI</span>
                <span class="top-brand-copy">
                    <strong>Workspace</strong>
                    <small>QITech Pipeline Pro</small>
                </span>
            </a>
            <nav class="top-links" aria-label="Navegação principal">
                <a class="active" href="{% url 'catalogo_fundos' %}">Fundos</a>
            </nav>
            <span class="top-context">Workspace comercial</span>
        </header>
        <main class="main-content">
            <header class="workspace-bar">
                <div>
                    <p class="eyebrow">Workspace</p>
                    <h2>{% block page_title %}Painel{% endblock %}</h2>
                </div>
            </header>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
