<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | QITech Workspace</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles/app.css' %}">
</head>
<body class="login-page">
    <main class="login-card">
        <span class="brand-mark">QI</span>
        <p class="eyebrow">QITech Pipeline Pro</p>
        <h1>Acesse seu workspace</h1>
        <p class="muted">Entre para consultar e organizar a sua carteira de fundos.</p>
        {% if form.errors %}<p class="login-error">Usuário ou senha inválidos.</p>{% endif %}
        <form method="post" class="stack-form">
            {% csrf_token %}
            <label for="id_username">Usuário</label>
            <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
            <label for="id_password">Senha</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password" required>
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
